*{box-sizing:border-box}body{margin:0;color:#f4f8fa;background:#08141b;font:16px/1.6 system-ui,sans-serif}header,main,footer{max-width:990px;margin:auto;padding:0 22px}header{display:flex;justify-content:space-between;align-items:center;min-height:78px;border-bottom:1px solid #2a424b;font-weight:900;letter-spacing:.12em}header span{color:#8ce8ad;letter-spacing:0}main{padding-top:24px}.hero,.panel{border:1px solid #29444c;border-radius:20px;padding:clamp(19px,4vw,36px);background:#10242c;margin-bottom:16px}.hero{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(110deg,#132e37,#10222c)}.hero::after{content:"";position:absolute;inset:0;z-index:-1;opacity:.45;background:repeating-linear-gradient(0deg,transparent 0 29px,#305561 30px),repeating-linear-gradient(90deg,transparent 0 29px,#305561 30px);mask-image:linear-gradient(90deg,transparent 40%,black)}h1,h2,p{margin:0 0 13px}h1{font-size:clamp(2rem,6vw,3.7rem);line-height:1.1;letter-spacing:-.07em}h2{font-size:1.28rem}p{color:#bad0d7}.signal{color:#8ce8ad;font-weight:800}.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}button{display:block;width:100%;margin-top:10px;background:#172f3b;color:#eff9ff;border:1px solid #41616c;border-radius:11px;padding:13px;font:inherit;font-weight:800;text-align:left;cursor:pointer}button:hover{border-color:#8ce8ad}button:focus-visible{outline:3px solid #efbe65}button.primary{background:#8ce8ad;color:#0b2618;border-color:#8ce8ad;text-align:center}button:disabled{cursor:default;opacity:.5}.clue{padding:12px;border-left:3px solid #8ce8ad;margin-top:10px;background:#152f37}.clue p{margin:3px 0 0}progress{height:10px;width:100%;accent-color:#8ce8ad}footer{padding-bottom:18px;color:#a9bec7;font-size:.875rem}@media(max-width:670px){header{min-height:60px}.grid{grid-template-columns:1fr;gap:0}main{padding-top:14px}}

const rooms=[{"story":"하부의 물자국을 발견했습니다. 지금도 새고 있는지 확인하세요.","explain":"재발한 물방울은 현재 누수의 관찰 근거입니다. 위치와 상태를 개선사항에 기록하세요.","name":"팽창탱크","answer":1,"clues":[{"text":"닦아낸 연결부에 물방울이 다시 맺혔습니다.","key":true,"label":"흔적 재확인"},{"text":"고정쇠 이탈은 관찰되지 않았습니다.","key":true,"label":"지지대 확인"},{"text":"표시된 설비 ID는 PT-01입니다.","key":false,"label":"명판 읽기"}],"id":"PT-01"},{"story":"운전 중 이상 소음 신고가 들어왔습니다. 진동 판정에 필요한 근거를 고르세요.","explain":"측정 조건과 기준이 빠져 기준 초과를 확정할 수 없습니다. 빠진 항목을 기록하고 재측정을 요청하세요.","name":"순환펌프","answer":2,"clues":[{"text":"진동 수치는 기록됐지만 측정 방향과 운전 조건이 빠져 있습니다.","key":true,"label":"측정 기록 보기"},{"text":"이 장비에 적용할 기준과 측정 조건을 현장에서 확인하지 못했습니다.","key":true,"label":"기준 확인"},{"text":"베이스와 외관이 사진에 담겨 있습니다.","key":false,"label":"외관 사진 보기"}],"id":"P-02"},{"story":"필터 점검입니다. 상태를 확인하고 이번에 기록할 내용을 고르세요.","explain":"필터 청소와 후속 확인을 개선사항으로 적으세요. 자료 없이 법정 부적합까지 확정할 근거는 없습니다.","name":"공기조화기","answer":1,"clues":[{"text":"필터 표면이 분진으로 막혀 청소가 필요합니다.","key":true,"label":"필터 상태 보기"},{"text":"최근 청소 여부는 확인되지 않았습니다.","key":true,"label":"정비 이력 보기"},{"text":"외함에 눈에 띄는 변형은 없습니다.","key":false,"label":"외함 보기"}],"id":"AHU-03"},{"story":"외관과 연결부 상태를 확인합니다.","explain":"확인된 부식과 도막 박리를 기록하세요. 물자국은 별도로 남기고 현재 누수로 확정하지 않습니다.","name":"냉각탑","answer":1,"clues":[{"text":"철재 프레임에 도막 박리와 녹이 관찰됩니다.","key":true,"label":"외관 확인"},{"text":"밸브 아래에 오래된 물자국이 있지만 현재 누수는 확인하지 못했습니다.","key":true,"label":"밸브 확인"},{"text":"사진에서 설비 모델을 읽을 수 있습니다.","key":false,"label":"명판 확인"}],"id":"CT-04"},{"story":"이번 게임에서는 지지대 고정 상태만 판단합니다.","explain":"확인한 지지대 항목에 한해 이상 없음으로 기록합니다. 설비 전체 판정에는 다른 점검도 필요합니다.","name":"환기설비","answer":0,"clues":[{"text":"전후 사진에서 지지대 이탈이나 빠진 체결부는 보이지 않습니다.","key":true,"label":"지지대 사진 대조"},{"text":"지정된 지지대를 모두 확인했고 풀림은 관찰되지 않았습니다.","key":true,"label":"현장 확인"},{"text":"덕트 표찰은 읽을 수 있습니다.","key":false,"label":"덕트 표찰 보기"}],"id":"EF-05"},{"story":"보온재 아래에 물자국이 있습니다. 현재 상태를 판단하세요.","explain":"사진에 보이는 흔적은 기록하고 원인은 확인 보류합니다.","name":"열교환기","answer":2,"clues":[{"text":"연결부를 확인했으나 진행 중인 누수는 보이지 않습니다.","key":true,"label":"연결부 재확인"},{"text" function btn(parent,label,run,primary=false,disabled=false){const b=el('button',label,primary?'primary':'',parent);b.disabled=disabled;b.onclick=run;return b}
function shuffle(list){const a=[...list];for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}

 function spotDistance(j){return Math.hypot(spots[j][0]-pose.x,spots[j][1]-pose.z)}

 btn(tools,'보조 조명',()=>{lamp=!lamp});
 const touch=[['왼쪽 회전','ArrowLeft'],['앞으로','KeyW'],['뒤로','KeyS'],['오른쪽 회전','ArrowRight']];
 touch.forEach(([name,key])=>{

 });
 el('p','이동: W·A·S·D 또는 버튼 · 시점: 좌우 방향키나 드래그 · 표시된 근거 가까이에서 E','instructions');
 const watched=new Set(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyE']);
 function down(e){if(!watched.has(e.code)||e.altKey||e.ctrlKey||e.metaKey)return;e.preventDefault();if(e.code==='KeyE'){if(!e.repeat)inspect();return}keys.add(e.code)}
 function up(e){keys.delete(e.code)}

 const solids=[];
 function box(x,z,w,d,y,h,colors){
  const a=[x-w/2,y,z-d/2],b=[x+w/2,y,z-d/2],c=[x+w/2,y,z+d/2],e=[x-w/2,y,z+d/2];

  [[a,b,top[1],top[0]],[b,c,top[2],top[1]],[c,e,top[3],top[2]],[e,a,top[0],top[3]],top].forEach((f,j)=>solids.push([f,colors[j%colors.length]]));
 }
 solids.push([[[-7,0,0],[7,0,0],[7,0,19],[-7,0,19]],'#dedbd1']);
 solids.push([[[-7,0,0],[-7,0,19],[-7,4,19],[-7,4,0]],'#e5e5dc'],[[[7,0,0],[7,0,19],[7,4,19],[7,4,0]],'#e5e5dc']);

  if(j%3===0){pipe(x,z,.75,.26,2.02,bright?'#428976':'#4d6771');box(x,z,1.0,.94,2.28,.18,gray);box(x+1,z,.6,.28,.58,.35,gray)}
  else if(j%3===1){box(x,z,2.15,1.32,.26,1.23,tones);for(let k=0;k<4;k++)box(x-.72+k*.46,z-.74,.18,.06,.55,.56,gray);box(x,z,.28,.31,1.49,.7,gray)}
  else{box(x,z,2.31,1.51,.26,1.63,tones);box(x+.56,z-.81,.62,.07,.87,.47,gray);box(x-.73,z, .26,.36,1.89,.44,gray)}
 }
 for(let j=0;j<5;j++)box(j%2?5.87:-5.87,2+j*3.6,.23,2.9,2.78,.21,['#9c693c','#684b32','#af8050']);
 const daylight=[];

 const clip=.10;
 let W,H,scale;
 function camera(v){const x=v[0]-pose.x,z=v[2]-pose.z,s=Math.sin(pose.a),c=Math.cos(pose.a);return [x*c-z*s,v[1]-1.52,z*c+x*s]}
 function near(a,b){const t=(clip-a[2])/(b[2]-a[2]);return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,clip]}
 function project(v){return [W/2+scale*v[0]/v[2],H*.47-scale*v[1]/v[2]]}
 function poly(vertices,color){
  const p=vertices.map(camera), points=[];
  p.forEach((a,j)=>{const b=p[(j+1)%p.length];if(a[2]>=clip)points.push(a);if((a[2]>=clip)!==(b[2]>=clip))points.push(near(a,b))});
  if(points.length<3)return;
  ctx.beginPath();points.map(project).forEach(([x,y],j)=>j?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fillStyle=color;ctx.fill();
 }
 function gridLine(a,b){
  a=camera(a);b=camera(b);
  if(a[2]<clip&&b[2]<clip)return;
  if(a[2]<clip)a=near(a,b);else if(b[2]<clip)b=near(b,a);
  const p=project(a),q=project(b);ctx.moveTo(...p);ctx.lineTo(...q);
 }
 function free(x,z){return Math.abs(x)<6.65&&z>.28&&z<18.65&&stations.every(([a,b])=>Math.abs(x-a)>1.56||Math.abs(z-b)>1.23)}
 let last=performance.now(),lastDistance=-1;
 function frame(now){
  if(!canvas.isConnected){endAudio();window.removeEventListener('keydown',down);window.removeEventListener('keyup',up);window.removeEventListener('blur',blur);return}
  const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;
  pose.a+=((keys.has('ArrowRight')?1:0)-(keys.has('ArrowLeft')?1:0))*1.85*dt;
  const f=(keys.has('KeyW')||keys.has('ArrowUp')?1:0)-(keys.has('KeyS')||keys.has('ArrowDown')?1:0);
  const s=(keys.has('KeyD')?1:0)-(keys.has('KeyA')?1:0);
  const dx=(Math.sin(pose.a)*f+Math.cos(pose.a)*s)*3.7*dt,dz=(Math.cos(pose.a)*f-Math.sin(pose.a)*s)*3.7*dt;
  if(free(pose.x+dx,pose.z))pose.x+=dx;if(free(pose.x,pose.z+dz))pose.z+=dz;
  const ratio=Math.min(2,devicePixelRatio||1);
  W=Math.round(canvas.clientWidth*ratio);H=Math.round(canvas.clientHeight*ratio);
  if(canvas.width!==W||canvas.height!==H){canvas.width=W;canvas.height=H}
  if(W&&H){
   scale=Math.min(W*.78,H*.94);ctx.fillStyle='#e9f2f5';ctx.fillRect(0,0,W,H);
   for(const [v,c] of solids.slice(0,5))poly(v,c);
   for(const [v,c] of daylight)poly(v,c);
   ctx.beginPath();
   for(let j=-7;j<=7;j++)gridLine([j,.008,0],[j,.008,19]);
   for(let j=0;j<20;j++)gridLine([-7,.008,j],[7,.008,j]);
   ctx.strokeStyle='#aeb9b6';ctx.lineWidth=ratio;ctx.stroke();
   const faces=solids.slice(5).map(([v,c])=>[v,c,v.reduce((sum,p)=>sum+camera(p)[2],0)/v.length]).sort((a,b)=>b[2]-a[2]);
   for(const [v,c] of faces)poly(v,c);
   stations.forEach(([x,z],j)=>{
    const v=camera([x,2.76,z]);if(v[2]<.7)return;
    const [a,b]=project(v);if(a<0||a>W||b<0||b>H)return;
    ctx.font='bold '+(13*ratio)+'px system-ui';const name=queue[j].id,tw=ctx.measureText(name).width;
    ctx.fillStyle=j===i?'#8ce8ad':'#263941';ctx.fillRect(a-tw/2-8*ratio,b-17*ratio,tw+16*ratio,23*ratio);
    ctx.fillStyle=j===i?'#10281b':'#d1e2e7';ctx.textAlign='center';ctx.fillText(name,a,b);
   });
   if(lamp && ctx.createRadialGradient){
    const g=ctx.createRadialGradient(W*.5,H*.47,Math.min(W,H)*.13,W*.5,H*.47,Math.max(W,H)*.66);
    g.addColorStop(0,'#00000000');g.addColorStop(1,'#50666167');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
   }
   const plate=camera([0,3.28,18.8]);
   if(plate[2]>.7 && brand && brand.complete && brand.naturalWidth && ctx.drawImage){
    const [x,y]=project(plate),w=Math.min(W*.32,scale*3.5/plate[2]),h=w*brand.naturalHeight/brand.naturalWidth;
    ctx.drawImage(brand,x-w/2,y-h/2,w,h);
   }
   spots.forEach(([x,z],j)=>{
    const position=camera([x,.34,z]);if(position[2]<.25)return;
    const [a,b]=project(position);if(a<0||a>W||b<0||b>H)return;
    const done=picked.includes(j),active=spotDistance(j)<=1.42;
    ctx.font='bold '+(12*ratio)+'px system-ui';
    const title=done?'확보 완료':r.clues[j].label,tw=ctx.measureText(title).width;
    ctx.fillStyle=done?'#183425':active?'#8ce8ad':'#e8bd68';ctx.fillRect(a-tw/2-6*ratio,b-14*ratio,tw+12*ratio,20*ratio);
    ctx.textAlign='center';ctx.fillStyle=done?'#a2e6b7':'#142320';ctx.fillText(title,a,b);
   });
   ctx.fillStyle='#e4f7f1';ctx.fillRect(W/2-5*ratio,H*.47,10*ratio,ratio);ctx.fillRect(W/2,H*.47-5*ratio,ratio,10*ratio);
  }
  const j=closestClue(),dist=j===undefined?0:spotDistance(j),step=Math.round(dist*10);
  if(step!==lastDistance){lastDistance=step;hud.textContent=dist<=1.42?'근거 조사 가능 · E':'가까운 조사 지점 '+(step/10).toFixed(1)+' m'}
  inspectButton.disabled=j===undefined||dist>1.42||picked.length>=2;
  decideNow.disabled=picked.length===0;
  counter.textContent='확보한 근거 '+picked.length+' / 2';
  requestAnimationFrame(frame);
 }
 requestAnimationFrame(frame);
}
